<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
  >
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F6F5">
  <meta name="application-name" content="ii-os">
  <meta
    name="description"
    content="ii-os is the creative operations workspace from Intelligent Iterations."
  >
  <meta property="og:title" content="ii-os · Creative operations">
  <meta
    property="og:description"
    content="Plan, generate, review, and operate creative workflows from one workspace."
  >
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ii-os">
  <meta name="msapplication-TileColor" content="#171B1F">

  <link rel="icon" href="icons/ii-os-mark.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="mask-icon" href="icons/ii-os-mask-icon.svg" color="#0B7661">
  <link rel="manifest" href="manifest.json">

  <title>ii-os · Creative operations</title>

  <style>
    /* Manrope is bundled as a Flutter asset; declaring it here lets the HTML
       bootstrap and the Flutter startup surface set in the same typeface.
       font-display: swap keeps first paint immediate -- the fallback stack
       renders instantly and swaps once the subset arrives. */
    @font-face {
      font-family: Manrope;
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("assets/packages/ii_os_design_system/fonts/Manrope-Regular.ttf") format("truetype");
    }

    @font-face {
      font-family: Manrope;
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url("assets/packages/ii_os_design_system/fonts/Manrope-ExtraBold.ttf") format("truetype");
    }

    :root {
      --ii-canvas: #f4f6f5;
      --ii-surface: #ffffff;
      --ii-ink: #171b1f;
      --ii-muted: #606a73;
      --ii-border: #cdd5da;
      --ii-green: #0b7661;
      --ii-green-bright: #5ed6b2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--ii-canvas);
    }

    body {
      color: var(--ii-ink);
      font-family: Manrope, Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #ii-os-bootstrap {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgb(11 118 97 / 8%), transparent 32rem),
        var(--ii-canvas);
      opacity: 1;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #ii-os-bootstrap::before {
      position: absolute;
      width: min(72vw, 580px);
      aspect-ratio: 1;
      border: 1px solid rgb(11 118 97 / 8%);
      border-radius: 50%;
      content: "";
      animation: ii-breathe 3.2s ease-in-out infinite;
    }

    #ii-os-bootstrap.is-ready {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .ii-os-bootstrap__content {
      position: relative;
      display: flex;
      width: min(100%, 320px);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ii-os-bootstrap__mark {
      display: block;
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 10px 22px rgb(23 27 31 / 16%));
    }

    .ii-os-bootstrap__name {
      margin: 18px 0 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .ii-os-bootstrap__tagline {
      margin: 9px 0 0;
      color: var(--ii-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .ii-os-bootstrap__progress {
      position: relative;
      width: 220px;
      height: 3px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--ii-border);
    }

    .ii-os-bootstrap__progress::after {
      position: absolute;
      inset: 0;
      width: 46%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--ii-green), var(--ii-green-bright));
      content: "";
      animation: ii-progress 1.35s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .ii-os-bootstrap__status {
      min-height: 18px;
      margin: 13px 0 0;
      color: var(--ii-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .ii-os-bootstrap__slow {
      display: none;
      margin: 10px 0 0;
      color: var(--ii-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    #ii-os-bootstrap.is-slow .ii-os-bootstrap__slow {
      display: block;
    }

    .ii-os-bootstrap__retry {
      display: none;
      margin-top: 18px;
      padding: 9px 14px;
      border: 1px solid var(--ii-border);
      border-radius: 6px;
      background: var(--ii-surface);
      color: var(--ii-ink);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .ii-os-bootstrap__retry:focus-visible {
      outline: 3px solid rgb(11 118 97 / 28%);
      outline-offset: 2px;
    }

    #ii-os-bootstrap.is-error .ii-os-bootstrap__progress {
      display: none;
    }

    #ii-os-bootstrap.is-error .ii-os-bootstrap__retry {
      display: inline-flex;
    }

    @keyframes ii-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(230%); }
    }

    @keyframes ii-breathe {
      0%, 100% { opacity: .4; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      #ii-os-bootstrap,
      #ii-os-bootstrap::before,
      .ii-os-bootstrap__progress::after {
        animation: none;
        transition-duration: 1ms;
      }

      .ii-os-bootstrap__progress::after {
        width: 62%;
        background: var(--ii-green);
      }
    }
  </style>

  <script src="flutter_bootstrap.js" defer></script>
</head>
<body>
  <main
    id="ii-os-bootstrap"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-label="Starting ii-os"
  >
    <div class="ii-os-bootstrap__content">
      <svg
        class="ii-os-bootstrap__mark"
        viewBox="0 0 64 64"
        role="img"
        aria-label="ii-os"
      >
        <rect x="2" y="2" width="60" height="60" rx="15" fill="#171B1F"/>
        <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#2F3938"/>
        <circle cx="24" cy="20" r="4.5" fill="#5ED6B2"/>
        <rect x="19.5" y="28" width="9" height="20" rx="4.5" fill="#5ED6B2"/>
        <circle cx="40" cy="20" r="4.5" fill="#F4F6F5"/>
        <rect x="35.5" y="28" width="9" height="20" rx="4.5" fill="#F4F6F5"/>
      </svg>
      <h1 class="ii-os-bootstrap__name">ii-os</h1>
      <p class="ii-os-bootstrap__tagline">Creative operations, in motion.</p>
      <div class="ii-os-bootstrap__progress" aria-hidden="true"></div>
      <p class="ii-os-bootstrap__status" id="ii-os-bootstrap-status">
        Preparing your workspace...
      </p>
      <p class="ii-os-bootstrap__slow">
        Still working--first visits can take a little longer.
      </p>
      <button class="ii-os-bootstrap__retry" id="ii-os-bootstrap-retry" type="button">
        Try again
      </button>
      <noscript>
        <p class="ii-os-bootstrap__status">
          ii-os needs JavaScript enabled to open your workspace.
        </p>
      </noscript>
    </div>
  </main>
</body>
</html>
