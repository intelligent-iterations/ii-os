# Video-editor export for the catalog id video-editor-render. The editor in
# the dashboard has already compiled the timeline into one FFmpeg invocation;
# this renders it on a CPU runner with ii-os's own renderer.
#
# Settings: II_OS_CONNECTOR_URL, II_OS_TOKEN, II_OS_CPU_RUNS_ON,
# II_OS_RUNNER_IMAGE_MEDIA_RENDER. See docs/generation.md.
name: ii-os video-editor render
run-name: ii-os generation ${{ inputs.ii_request_id }}

on:
  workflow_dispatch:
    inputs:
      ii_request_id:
        description: ii-os request identity
        required: true
        type: string
      ii_payload_mode:
        description: Payload delivery contract (inputs are always read from the claim)
        required: false
        type: string
        default: claim
      render_manifest:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: ii-os-video-editor-render-${{ inputs.ii_request_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Render the export
    runs-on: ${{ fromJSON(vars.II_OS_CPU_RUNS_ON) }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      RUNNER_NAME: media-render
      RUNNER_TASK: editor-render
    steps:
      - name: Check out this workflow's commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check settings
        shell: bash
        env:
          II_OS_CONNECTOR_URL: ${{ vars.II_OS_CONNECTOR_URL }}
          II_OS_TOKEN: ${{ secrets.II_OS_TOKEN }}
          II_OS_RUNNER_IMAGE_MEDIA_RENDER: ${{ vars.II_OS_RUNNER_IMAGE_MEDIA_RENDER }}
        run: >-
          python3 scripts/ii_os_settings.py check --connector
          --runner-image II_OS_RUNNER_IMAGE_MEDIA_RENDER

      - name: Claim the request
        id: claim
        uses: ./.github/actions/ii-os-claim
        with:
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          max-sources: "12"
          source-kinds: image,video,audio

      - name: Plan the run
        id: plan
        shell: bash
        env:
          WORK_DIR: ${{ steps.claim.outputs.work-dir }}
        run: >-
          python3 "runners/${RUNNER_NAME}/entrypoint.py" plan --task "${RUNNER_TASK}"
          --input-dir "${WORK_DIR}/in" --github-output "${GITHUB_OUTPUT}"

      - name: Render in the isolated runner container
        shell: bash
        env:
          RUNNER_IMAGE: ${{ vars.II_OS_RUNNER_IMAGE_MEDIA_RENDER }}
          WORK_DIR: ${{ steps.claim.outputs.work-dir }}
        run: >-
          python3 scripts/ii_os_run_container.py run --runner "${RUNNER_NAME}"
          --image "${RUNNER_IMAGE}" --work-dir "${WORK_DIR}" --shm-size 2g
          -- run --task "${RUNNER_TASK}"

      - name: Publish the export
        id: complete
        uses: ./.github/actions/ii-os-complete
        with:
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          work-dir: ${{ steps.claim.outputs.work-dir }}
          bucket: ${{ steps.claim.outputs.bucket }}
          object-prefix: ${{ steps.claim.outputs.object-prefix }}
          workload-identity-provider: ${{ steps.claim.outputs.workload-identity-provider }}
          service-account: ${{ steps.claim.outputs.service-account }}
          allowed-content-types: video/mp4,video/webm
          max-bytes: "536870912"

      - name: Report a failure
        if: ${{ always() && steps.claim.outcome != 'skipped' && steps.complete.outcome != 'success' }}
        uses: ./.github/actions/ii-os-complete
        with:
          status: failed
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          work-dir: ${{ steps.claim.outputs.work-dir }}
          job-status: ${{ job.status }}
          error-code: video_editor_render_failed
          cancelled-error-code: video_editor_render_cancelled

      - name: Remove the container and the run directory
        if: ${{ always() }}
        shell: bash
        env:
          II_REQUEST_ID: ${{ inputs.ii_request_id }}
        run: |
          python3 scripts/ii_os_run_container.py remove --runner "${RUNNER_NAME}"
          python3 scripts/ii_os_claim.py cleanup

  report-terminal-status:
    name: Report a run that could not finish
    needs: generate
    if: ${{ always() && needs.generate.result != 'success' }}
    runs-on: ${{ fromJSON(vars.II_OS_CPU_RUNS_ON) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out this workflow's commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Report the terminal status
        uses: ./.github/actions/ii-os-complete
        with:
          status: failed
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          job-status: ${{ needs.generate.result }}
          error-code: video_editor_render_failed
          cancelled-error-code: video_editor_render_cancelled
