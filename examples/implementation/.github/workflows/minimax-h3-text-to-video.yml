# MiniMax H3 audiovisual generation for the catalog id text-to-video-minimax-h3:
# a 4-15 second 720p MP4 with native stereo audio, from text alone or with
# endpoint frames, image/video/audio references, a source video to edit, or a
# source video to continue. Published with its opening frame as a poster.
#
# Settings: II_OS_CONNECTOR_URL, II_OS_TOKEN, II_OS_GPU_RUNS_ON,
# II_OS_CPU_RUNS_ON, II_OS_MODEL_ROOT, II_OS_RUNNER_IMAGE_MINIMAX_H3.
# See docs/generation.md, and runners/minimax-h3/README.md for the model
# license's territorial limits before you deploy it.
name: ii-os MiniMax H3 video
run-name: ii-os generation ${{ inputs.ii_request_id }}

on:
  workflow_dispatch:
    inputs:
      ii_request_id:
        description: ii-os request identity
        required: true
        type: string
      ii_payload_mode:
        description: Payload delivery contract (inputs are always read from the claim)
        required: false
        type: string
        default: claim
      prompt:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      duration_seconds:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      orientation:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      fps:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      performance_mode:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      generation_mode:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      reference_manifest:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      extension_method:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      edit_operation:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""
      identity_replacement_consent:
        description: Delivered through the ii-os claim; this event value is ignored
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: ii-os-text-to-video-minimax-h3-${{ inputs.ii_request_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the video
    runs-on: ${{ fromJSON(vars.II_OS_GPU_RUNS_ON) }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      RUNNER_NAME: minimax-h3
      RUNNER_TASK: text-to-video
    steps:
      - name: Check out this workflow's commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check settings
        shell: bash
        env:
          II_OS_CONNECTOR_URL: ${{ vars.II_OS_CONNECTOR_URL }}
          II_OS_TOKEN: ${{ secrets.II_OS_TOKEN }}
          II_OS_MODEL_ROOT: ${{ vars.II_OS_MODEL_ROOT }}
          II_OS_RUNNER_IMAGE_MINIMAX_H3: ${{ vars.II_OS_RUNNER_IMAGE_MINIMAX_H3 }}
        run: >-
          python3 scripts/ii_os_settings.py check --connector --model-root
          --runner-image II_OS_RUNNER_IMAGE_MINIMAX_H3

      - name: Claim the request
        id: claim
        uses: ./.github/actions/ii-os-claim
        with:
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          max-sources: "12"
          source-kinds: image,video,audio

      - name: Plan the run
        id: plan
        shell: bash
        env:
          WORK_DIR: ${{ steps.claim.outputs.work-dir }}
        run: >-
          python3 "runners/${RUNNER_NAME}/entrypoint.py" plan --task "${RUNNER_TASK}"
          --input-dir "${WORK_DIR}/in" --github-output "${GITHUB_OUTPUT}"

      - name: Check the model folder
        shell: bash
        env:
          II_OS_MODEL_ROOT: ${{ vars.II_OS_MODEL_ROOT }}
          PROFILE: ${{ steps.plan.outputs.profile }}
        run: >-
          python3 scripts/ii_os_model_folder.py check --manifest "runners/${RUNNER_NAME}/models.json"
          --model-root "${II_OS_MODEL_ROOT}" --profile "${PROFILE}"

      - name: Generate in the isolated runner container
        shell: bash
        env:
          II_OS_MODEL_ROOT: ${{ vars.II_OS_MODEL_ROOT }}
          RUNNER_IMAGE: ${{ vars.II_OS_RUNNER_IMAGE_MINIMAX_H3 }}
          WORK_DIR: ${{ steps.claim.outputs.work-dir }}
        run: >-
          python3 scripts/ii_os_run_container.py run --runner "${RUNNER_NAME}" --gpu
          --image "${RUNNER_IMAGE}" --model-root "${II_OS_MODEL_ROOT}" --work-dir "${WORK_DIR}"
          -- run --task "${RUNNER_TASK}"

      - name: Publish the video and its poster
        id: complete
        uses: ./.github/actions/ii-os-complete
        with:
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          work-dir: ${{ steps.claim.outputs.work-dir }}
          bucket: ${{ steps.claim.outputs.bucket }}
          object-prefix: ${{ steps.claim.outputs.object-prefix }}
          workload-identity-provider: ${{ steps.claim.outputs.workload-identity-provider }}
          service-account: ${{ steps.claim.outputs.service-account }}
          allowed-content-types: video/mp4,image/png
          max-bytes: "2147483648"

      - name: Report a failure
        if: ${{ always() && steps.claim.outcome != 'skipped' && steps.complete.outcome != 'success' }}
        uses: ./.github/actions/ii-os-complete
        with:
          status: failed
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          work-dir: ${{ steps.claim.outputs.work-dir }}
          job-status: ${{ job.status }}
          error-code: minimax_h3_workflow_failed
          cancelled-error-code: minimax_h3_workflow_cancelled
          runner-error-codes: minimax_h3_reference_rejected

      - name: Remove the container and the run directory
        if: ${{ always() }}
        shell: bash
        env:
          II_REQUEST_ID: ${{ inputs.ii_request_id }}
        run: |
          python3 scripts/ii_os_run_container.py remove --runner "${RUNNER_NAME}"
          python3 scripts/ii_os_claim.py cleanup

  report-terminal-status:
    name: Report a run that could not finish
    needs: generate
    if: ${{ always() && needs.generate.result != 'success' }}
    runs-on: ${{ fromJSON(vars.II_OS_CPU_RUNS_ON) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out this workflow's commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Report the terminal status
        uses: ./.github/actions/ii-os-complete
        with:
          status: failed
          connector-url: ${{ vars.II_OS_CONNECTOR_URL }}
          token: ${{ secrets.II_OS_TOKEN }}
          request-id: ${{ inputs.ii_request_id }}
          job-status: ${{ needs.generate.result }}
          error-code: minimax_h3_workflow_failed
          cancelled-error-code: minimax_h3_workflow_cancelled
