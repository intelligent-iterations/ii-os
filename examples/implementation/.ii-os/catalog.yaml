# The ii-os workflow catalog for this repository. The dashboard reads this
# file from the connected repository and dispatches the workflow each entry
# names with only `ii_request_id`; the workflow claims the validated inputs.
#
# runtime_estimates are baselines measured on one NVIDIA GPU with 24 GB of VRAM.
# They only shape the dashboard's progress estimate; replace them with numbers
# measured on your own runners. See docs/generation.md.
schema_version: 1
workflows:
  - id: image-create
    name: Z-Image Turbo
    model: Z-Image Turbo
    contract_version: 2
    dispatch_workflow: .github/workflows/z-image-turbo-text-to-image.yml
    inputs:
      prompt:
        type: string
        required: true
        max_length: 60000
      aspect_ratio:
        type: string
        required: true
        max_length: 8
        allowed_values: ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16"]
      model:
        type: string
        required: true
        max_length: 32
      seed:
        type: number
        required: false
    runtime_estimates:
      - baseline_runtime_seconds: 30
        hardware: NVIDIA GPU, 24 GB VRAM
        measured_at: 2026-08-22
    outputs:
      - kind: image
        content_types: [image/png, image/jpeg, image/webp]
        max_bytes: 52428800
