  # MiniMax H3's license excludes the European Union, the United Kingdom, the
  # Republic of Korea and the United States; read runners/minimax-h3/README.md
  # before you enable this entry.
  - id: text-to-video-minimax-h3
    name: MiniMax H3 Audiovisual Studio
    model: MiniMax H3
    contract_version: 1
    dispatch_workflow: .github/workflows/minimax-h3-text-to-video.yml
    inputs:
      prompt:
        type: string
        required: true
        max_length: 7000
      duration_seconds:
        type: number
        required: true
        minimum: 4
        maximum: 15
        default: 15
      orientation:
        type: string
        required: true
        max_length: 16
        allowed_values: [portrait, landscape]
      fps:
        type: number
        required: true
        minimum: 24
        maximum: 24
        default: 24
      performance_mode:
        type: string
        required: true
        max_length: 16
        allowed_values: [quality, turbo]
      generation_mode:
        type: string
        required: true
        max_length: 40
      reference_manifest:
        type: string
        required: true
        max_length: 30000
      edit_operation:
        type: string
        required: false
        max_length: 40
      identity_replacement_consent:
        type: boolean
        required: false
    runtime_estimates:
      - selector:
          performance_mode: quality
        duration_input: duration_seconds
        baseline_output_seconds: 15
        baseline_runtime_seconds: 1953
        hardware: NVIDIA GPU, 24 GB VRAM
        measured_at: 2026-08-14
      - selector:
          performance_mode: turbo
        duration_input: duration_seconds
        baseline_output_seconds: 15
        baseline_runtime_seconds: 900
        hardware: NVIDIA GPU, 24 GB VRAM
        measured_at: 2026-08-14
    outputs:
      - kind: video
        content_types: [video/mp4]
        max_bytes: 2147483648
